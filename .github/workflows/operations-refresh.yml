name: Operational analytics refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m ops.build_operations --generate-demo
      - run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/upload-artifact@v4
        with:
          name: workforce-operations-refresh
          path: data/output/operations/
          if-no-files-found: error
